name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release precisa de todo o histórico e das tags para calcular a próxima versão.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Identidade do commit de release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          before="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo none)"
          pnpm exec semantic-release
          git fetch --tags --force
          after="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo none)"

          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum commit relevante desde $before; nada a publicar."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "Release $after publicado."
          fi

  image:
    needs: version
    if: needs.version.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
